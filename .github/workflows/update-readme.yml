name: Update coding practice stats

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-readme.yml"
      - ".github/scripts/**"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [update-profile]

concurrency:
  group: update-coding-stats
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Update LeetCode and NeetCode statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: jonnyterrero
          LEETCODE_USERNAME: jterrero16
          NEETCODE_REPOSITORY: Neetcode-Problems
        run: |
          python -m unittest discover -s .github/scripts -p "test_*.py"
          python .github/scripts/update_coding_stats.py

      - name: Commit updated statistics
        run: |
          if git diff --quiet -- README.md; then
            echo "Coding statistics are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update coding practice stats [skip ci]"
          git push
